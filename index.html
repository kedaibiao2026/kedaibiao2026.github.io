<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="assets/avatar.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课代表 · 永久收藏页</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;min-height:100%}
    body{font-family:"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
      min-height:100vh;color:#e8edf7;overflow-x:hidden;background:#0d0b22;
      background-image:radial-gradient(1100px 700px at 50% 0%,#1b1740 0%,#0d0b22 65%)}
    /* 全屏粒子背景：鼠标可互动 */
    #particles{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
    /* 内容层：不套大盒子，直接悬浮在背景上 */
    .wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:40px 16px;text-align:center}
    .avatar{width:112px;height:112px;border-radius:50%;display:block;object-fit:cover;
      border:3px solid #ffd035;box-shadow:0 0 0 6px rgba(255,208,53,.12),0 0 34px rgba(255,208,53,.45);
      animation:float 4s ease-in-out infinite,magic 3s ease-in-out infinite alternate}
    h1{font-size:clamp(1.9rem,5vw,2.5rem);margin:18px 0 8px;color:#fff;font-weight:800;display:flex;justify-content:center;letter-spacing:2px}
    h1 span{display:inline-block;animation:wave 1.8s infinite;animation-delay:calc(.1s * var(--i))}
    .slogan{color:#ffd035;font-size:1.05rem;font-weight:700;letter-spacing:1px}
    .tip{font-size:.9rem;color:#c9b7e0;margin:10px 0 26px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
    .tip b{color:#ffcf5c}
    /* 三个炫酷入口：并排卡片，宽度自适应，不再铺满整行 */
    .sites{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:min(680px,100%);margin-bottom:28px}
    .site-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;
      padding:20px 12px 18px;border-radius:18px;background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s;
      animation:cardIn .7s both;overflow:hidden}
    .site-card:nth-child(1){animation-delay:.05s}.site-card:nth-child(2){animation-delay:.15s}.site-card:nth-child(3){animation-delay:.25s}
    .site-card::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .3s;pointer-events:none}
    .site-card:hover{transform:translateY(-10px) scale(1.04);border-color:rgba(255,255,255,.4)}
    .site-card.main:hover{box-shadow:0 14px 40px rgba(46,204,113,.35)}
    .site-card.backup:hover{box-shadow:0 14px 40px rgba(255,208,53,.32)}
    .site-card.source:hover{box-shadow:0 14px 40px rgba(155,89,182,.38)}
    .orb{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.7rem;
      color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.18)}
    .main .orb{background:linear-gradient(135deg,#1e7a52,#3ddc84)}
    .backup .orb{background:linear-gradient(135deg,#c8960c,#ffd035)}
    .source .orb{background:linear-gradient(135deg:#5b3fa8,#a86ff0)}
    .site-name{font-size:1.05rem;font-weight:800;color:#fff}
    .site-url{font-size:.72rem;color:#9fc0ff;word-break:break-all;line-height:1.35}
    .site-card:hover .site-url{color:#ffd98a}
    .site-badge{position:absolute;top:10px;right:10px;font-size:.62rem;padding:2px 8px;border-radius:20px;
      background:rgba(255,255,255,.12);color:#dfe7ff}
    /* 赞助：轻玻璃小卡 */
    .sponsor{width:min(680px,100%);margin-bottom:24px;animation:cardIn .8s .3s both}
    .sponsor .st{font-size:.9rem;color:#ffd035;margin-bottom:12px;font-weight:600}
    .qr-row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
    .qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;
      padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#c9d4ee;font-size:.82rem;
      transition:transform .3s,box-shadow .3s}
    .qr-card:hover{transform:translateY(-6px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
    .qr-card img{width:120px;height:120px;background:#fff;border-radius:6px;padding:4px;display:block}
    /* 操作按钮 */
    .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
    .btn{font-size:1rem;text-decoration:none;background:linear-gradient(45deg,#e94560,#8a2be2);color:#fff;
      padding:12px 30px;border:none;border-radius:50px;cursor:pointer;font-weight:600;
      box-shadow:0 6px 20px rgba(233,69,96,.35);transition:all .3s}
    .btn:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 10px 30px rgba(233,69,96,.55)}
    .countdown{font-size:1rem;color:#dfe7ff;font-weight:500}
    .countdown #cancel{color:#82aaff;cursor:pointer;font-size:.85em;margin-left:10px}
    .countdown #cancel:hover{text-decoration:underline}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes magic{from{box-shadow:0 0 0 6px rgba(255,208,53,.10),0 0 26px rgba(255,208,53,.35)}
      to{box-shadow:0 0 0 9px rgba(255,208,53,.18),0 0 42px rgba(255,208,53,.65)}}
    @keyframes wave{0%,40%,100%{transform:translateY(0);text-shadow:0 0 4px rgba(255,255,255,.4)}
      20%{transform:translateY(-14px);text-shadow:0 0 18px #fff,0 0 28px #82aaff,0 0 40px #82aaff}}
    @keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    /* 收藏弹窗 */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;
      visibility:hidden;opacity:0;transition:opacity .3s,visibility .3s;z-index:100}
    .modal.active{visibility:visible;opacity:1}
    .modal-content{background:#1b1b2b;color:#e0e0e0;padding:30px;border-radius:12px;text-align:center;max-width:82%;
      box-shadow:0 8px 30px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12)}
    .modal-content p{font-size:1.15rem;margin-bottom:20px;color:#fff}
    .close-btn{background:#e94560;color:#fff;border:none;padding:10px 22px;border-radius:20px;cursor:pointer}
    .close-btn:hover{background:#c63a50}
    @media(max-width:640px){.sites{grid-template-columns:1fr;gap:12px}.site-card{flex-direction:row;text-align:left;justify-content:flex-start;padding:14px 18px;gap:14px}
      .orb{width:48px;height:48px;font-size:1.3rem;flex-shrink:0}.site-name{font-size:1rem}.site-url{font-size:.78rem}.site-badge{display:none}
      .avatar{width:96px;height:96px}.actions{flex-direction:column;align-items:center;gap:10px}.btn{width:80%;text-align:center}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="wrap">
    <img class="avatar" src="assets/avatar.jpg" alt="课代表头像" />
    <h1>
      <span style="--i:1">即</span><span style="--i:2">将</span><span style="--i:3">进</span><span style="--i:4">入</span><span style="--i:5">.</span><span style="--i:6">.</span><span style="--i:7">.</span>
    </h1>
    <div class="slogan">抓考点 · 划重点 · 稳得分</div>
    <div class="tip">📢 域名可能变动，<b>建议收藏本页</b>，随时找回全部入口</div>

    <div class="sites">
      <a class="site-card main" href="https://kedaibiao.ccwu.cc/" target="_blank" rel="noopener noreferrer">
        <span class="site-badge">推荐</span>
        <span class="orb">🌐</span><span class="site-name">主站</span>
        <span class="site-url">kedaibiao.ccwu.cc</span>
      </a>
      <a class="site-card backup" href="https://kedaibiao2026.cc.cd/" target="_blank" rel="noopener noreferrer">
        <span class="site-badge">备用</span>
        <span class="orb">🔄</span><span class="site-name">备用站</span>
        <span class="site-url">kedaibiao2026.cc.cd</span>
      </a>
      <a class="site-card source" href="https://kedaibiao2026.pages.dev/" target="_blank" rel="noopener noreferrer">
        <span class="site-badge">源站</span>
        <span class="orb">⚙️</span><span class="site-name">源站</span>
        <span class="site-url">kedaibiao2026.pages.dev</span>
      </a>
    </div>

    <div class="sponsor">
      <div class="st">💛 赞助支持 · 所有资源完全免费</div>
      <div class="qr-row">
        <div class="qr-card"><img src="assets/qr/wechat-sponsor.png" alt="微信赞助二维码"><span>微信赞助</span></div>
        <div class="qr-card"><img src="assets/qr/alipay-sponsor.png" alt="支付宝赞助二维码"><span>支付宝赞助</span></div>
      </div>
    </div>

    <div class="actions">
      <a id="manualLink" class="btn" href="#">手动跳转</a>
      <span id="bookmarkBtn" class="btn">收藏本页</span>
    </div>
    <div class="countdown"><span id="cdText">5秒后自动跳转</span><span id="cancel">取消</span></div>
  </div>

  <div id="bookmarkModal" class="modal">
    <div class="modal-content">
      <p>请按 Ctrl+D (Windows) 或 Command+D (Mac) 收藏此页面。</p>
      <button class="close-btn" id="closeModalBtn">关闭</button>
    </div>
  </div>

  <script>
    /* --- 粒子背景：内联实现 + 鼠标交互(靠近连线/点击推开)，零 CDN 依赖 --- */
    (function(){
      if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var c=document.getElementById('particles'),x=c.getContext('2d'),W,H,ps=[],n=75;
      var mouse={x:-9999,y:-9999};
      function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
      resize(); addEventListener('resize',resize);
      addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY});
      addEventListener('mouseout',function(){mouse.x=-9999;mouse.y=-9999});
      addEventListener('touchmove',function(e){if(e.touches[0]){mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY}},{passive:true});
      addEventListener('click',function(e){
        for(var i=0;i<n;i++){var p=ps[i],dx=p.x-e.clientX,dy=p.y-e.clientY,d=Math.sqrt(dx*dx+dy*dy);
          if(d<160&&d>0){p.vx+=dx/d*2.4;p.vy+=dy/d*2.4}}
      });
      for(var i=0;i<n;i++){var vx=(Math.random()-.5)*.6,vy=(Math.random()-.5)*.6;
        ps.push({x:Math.random()*W,y:Math.random()*H,vx:vx,vy:vy,bx:vx,by:vy})}
      function draw(){
        x.clearRect(0,0,W,H);
        for(var i=0;i<n;i++){
          var p=ps[i];
          p.vx+=(p.bx-p.vx)*.02; p.vy+=(p.by-p.vy)*.02;  // 回归基础速度
          p.x+=p.vx; p.y+=p.vy;
          if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
          // 鼠标邻近：高亮 + grab 连线
          var mdx=p.x-mouse.x,mdy=p.y-mouse.y,md2=mdx*mdx+mdy*mdy;
          var near=md2<20000;
          x.fillStyle=near?'rgba(255,208,53,.95)':'rgba(255,255,255,.5)';
          x.beginPath();x.arc(p.x,p.y,near?3:2,0,6.283);x.fill();
          if(near){x.strokeStyle='rgba(255,208,53,'+(.5*(1-md2/20000))+')';
            x.beginPath();x.moveTo(p.x,p.y);x.lineTo(mouse.x,mouse.y);x.stroke()}
          for(var j=i+1;j<n;j++){
            var q=ps[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;
            if(d<18000){x.strokeStyle='rgba(180,200,255,'+(.16*(1-d/18000))+')';
              x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* --- 跳转：targetUrls 一处可改，默认跳主站 --- */
    var targetUrls=["https://kedaibiao.ccwu.cc/","https://kedaibiao2026.cc.cd/","https://kedaibiao2026.pages.dev/"];
    var targetUrl=targetUrls[0];
    var manual=document.getElementById('manualLink'); manual.href=targetUrl;
    var seconds=5,cdText=document.getElementById('cdText'),cancel=document.getElementById('cancel'),stopped=false;
    manual.addEventListener('click',function(){stopped=true});
    var timer=setInterval(function(){
      if(stopped){clearInterval(timer);return}
      if(seconds>1){seconds--;cdText.textContent=seconds+'秒后自动跳转'}
      else{clearInterval(timer);window.location.href=targetUrl}
    },1000);
    cancel.addEventListener('click',function(){stopped=true;clearInterval(timer);
      cdText.textContent='已取消，请从上方选择或手动跳转';cancel.style.display='none'});

    /* --- 收藏弹窗 --- */
    var bookmarkBtn=document.getElementById('bookmarkBtn'),modal=document.getElementById('bookmarkModal'),closeBtn=document.getElementById('closeModalBtn');
    bookmarkBtn.addEventListener('click',function(){
      if(window.external&&'AddFavorite' in window.external) window.external.AddFavorite(location.href,document.title);
      else modal.classList.add('active');
    });
    closeBtn.addEventListener('click',function(){modal.classList.remove('active')});
    modal.addEventListener('click',function(e){if(e.target===modal)modal.classList.remove('active')});
  </script>
</body>
</html>
