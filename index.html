<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="assets/avatar.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课代表 · 永久收藏页</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
      display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1a1a2e;color:#e0e0e0;overflow-x:hidden}
    #particles{position:fixed;width:100%;height:100%;top:0;left:0;z-index:1}
    .container{position:relative;z-index:2;text-align:center;padding:38px 30px;
      background:rgba(27,27,43,.55);border-radius:15px;box-shadow:0 8px 32px rgba(0,0,0,.37);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);
      max-width:90%;width:600px;animation:fadeIn 1s ease-out}
    .avatar{width:120px;height:120px;border-radius:50%;margin:0 auto 18px;display:block;
      border:3px solid rgba(255,208,53,.75);animation:float 4s ease-in-out infinite}
    h1{font-size:2.2em;margin-bottom:12px;color:#fff;font-weight:700;display:flex;justify-content:center;min-height:40px}
    h1 span{display:inline-block;animation:wave 1.8s infinite;animation-delay:calc(.1s * var(--i))}
    .slogan{color:#ffd035;font-size:1.05em;font-weight:600;margin-bottom:8px;animation:fadeIn 2s 1s backwards}
    .tip{font-size:1em;margin-bottom:18px;color:#f9a825;animation:fadeIn 2s 1s backwards}
    .links{margin-bottom:20px;animation:fadeIn .8s .2s backwards}
    .link-item{display:flex;align-items:center;gap:10px;background:rgba(130,170,255,.08);border:1px solid rgba(130,170,255,.18);
      border-radius:10px;padding:9px 14px;margin-bottom:8px;transition:background .25s,border-color .25s,transform .25s}
    .link-item:hover{background:rgba(130,170,255,.16);border-color:rgba(130,170,255,.45);transform:translateX(3px)}
    .link-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.05em;flex-shrink:0}
    .link-ico.main{background:linear-gradient(135deg,#2e7d5b,#39c27a)}
    .link-ico.backup{background:linear-gradient(135deg,#b8860b,#ffd035)}
    .link-ico.source{background:linear-gradient(135deg,#5b4bb7,#8a2be2)}
    .link-body{flex:1;text-align:left;min-width:0}
    .link-tag{display:block;font-size:.78em;color:#9fb0d4;margin-bottom:1px}
    .link-item a{color:#9dc0ff;text-decoration:none;font-size:.92em;word-break:break-all}
    .link-item a:hover{color:#ffd035}
    .sponsor{margin-bottom:18px;animation:fadeIn .8s .4s backwards}
    .sponsor .st{font-size:.9em;color:#c9d4ee;margin-bottom:10px}
    .qr-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
    .qr-card{display:flex;flex-direction:column;align-items:center;gap:5px;color:#9fb0d4;font-size:.85em}
    .qr-card img{width:130px;height:130px;background:#fff;display:block;border-radius:6px;padding:4px;box-sizing:border-box}
    .btn{font-size:1.1em;text-decoration:none;background:linear-gradient(45deg,#e94560,#8a2be2);color:#fff;
      padding:12px 25px;border:none;border-radius:50px;transition:all .3s ease;margin:10px;display:inline-block;
      cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.2);font-weight:500}
    .btn:hover{transform:translateY(-5px) scale(1.05);box-shadow:0 8px 25px rgba(0,0,0,.3)}
    .countdown{font-size:1.1em;margin-top:20px;color:#fff;font-weight:500}
    .countdown #cancel{color:#82aaff;cursor:pointer;font-size:.85em;margin-left:8px}
    .countdown #cancel:hover{text-decoration:underline}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
    @keyframes wave{0%,40%,100%{transform:translateY(0);text-shadow:0 0 5px rgba(255,255,255,.5)}
      20%{transform:translateY(-15px);text-shadow:0 0 20px #fff,0 0 30px #82aaff,0 0 40px #82aaff}}
    .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:flex;
      align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:opacity .3s,visibility .3s;z-index:100}
    .modal.active{visibility:visible;opacity:1}
    .modal-content{background:#1b1b2b;color:#e0e0e0;padding:30px;border-radius:10px;text-align:center;
      max-width:80%;box-shadow:0 4px 15px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1)}
    .modal-content p{font-size:1.2em;margin-bottom:20px;color:#fff}
    .modal-content .close-btn{background:#e94560;color:#fff;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;transition:background .3s}
    .modal-content .close-btn:hover{background:#c63a50}
    @media(max-width:768px){.container{padding:30px 20px;width:90%}.avatar{width:100px;height:100px}h1{font-size:1.8em;min-height:35px}.tip{font-size:.9em}.btn{padding:10px 20px;font-size:1em;margin:8px}}
    @media(max-width:480px){.btn{display:block;width:80%;margin:10px auto}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="container">
    <img class="avatar" src="assets/avatar.jpg" alt="课代表头像" />
    <h1>
      <span style="--i:1">即</span><span style="--i:2">将</span><span style="--i:3">进</span><span style="--i:4">入</span><span style="--i:5">.</span><span style="--i:6">.</span><span style="--i:7">.</span>
    </h1>
    <div class="slogan">抓考点 · 划重点 · 稳得分</div>
    <div class="tip">📢 域名可能变动，建议收藏此导航页！</div>
    <div class="links">
      <div class="link-item"><span class="link-ico main">🌐</span><span class="link-body"><span class="link-tag">主站 · 推荐收藏</span><a href="https://kedaibiao.ccwu.cc/" target="_blank" rel="noopener noreferrer">https://kedaibiao.ccwu.cc/</a></span></div>
      <div class="link-item"><span class="link-ico backup">🔄</span><span class="link-body"><span class="link-tag">备用站 · 打不开时用</span><a href="https://kedaibiao2026.cc.cd/" target="_blank" rel="noopener noreferrer">https://kedaibiao2026.cc.cd/</a></span></div>
      <div class="link-item"><span class="link-ico source">⚙️</span><span class="link-body"><span class="link-tag">源站 · Cloudflare</span><a href="https://kedaibiao2026.pages.dev/" target="_blank" rel="noopener noreferrer">https://kedaibiao2026.pages.dev/</a></span></div>
    </div>
    <div class="sponsor">
      <div class="st">💛 赞助支持 · 所有资源完全免费</div>
      <div class="qr-row">
        <div class="qr-card"><img src="assets/qr/wechat-sponsor.png" alt="微信赞助二维码"><span>微信赞助</span></div>
        <div class="qr-card"><img src="assets/qr/alipay-sponsor.png" alt="支付宝赞助二维码"><span>支付宝赞助</span></div>
      </div>
    </div>
    <div>
      <a id="manualLink" class="btn" href="#">手动跳转</a>
      <span id="bookmarkBtn" class="btn">收藏本页</span>
    </div>
    <div class="countdown"><span id="cdText">5秒后自动跳转</span><span id="cancel">取消</span></div>
  </div>

  <div id="bookmarkModal" class="modal">
    <div class="modal-content">
      <p>请按 Ctrl+D (Windows) 或 Command+D (Mac) 收藏此页面。</p>
      <button class="close-btn" id="closeModalBtn">关闭</button>
    </div>
  </div>

  <script>
    /* --- 轻量粒子背景：内联实现，不依赖任何 CDN，断网也能显示完整导航 --- */
    (function(){
      if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var c=document.getElementById('particles'),x=c.getContext('2d'),W,H,ps=[],n=70;
      function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
      resize(); addEventListener('resize',resize);
      for(var i=0;i<n;i++) ps.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6});
      function draw(){
        x.clearRect(0,0,W,H);
        for(var i=0;i<n;i++){
          var p=ps[i];p.x+=p.vx;p.y+=p.vy;
          if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
          x.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.arc(p.x,p.y,2,0,6.283);x.fill();
          for(var j=i+1;j<n;j++){
            var q=ps[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;
            if(d<22500){x.strokeStyle='rgba(255,255,255,'+(.15*(1-d/22500))+')';
              x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();}
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* --- 跳转：targetUrls 一处可改；默认跳主站 --- */
    var targetUrls=[
      "https://kedaibiao.ccwu.cc/",
      "https://kedaibiao2026.cc.cd/",
      "https://kedaibiao2026.pages.dev/"
    ];
    var targetUrl=targetUrls[0];
    var manual=document.getElementById('manualLink');
    manual.href=targetUrl;
    var seconds=5,cdText=document.getElementById('cdText'),cancel=document.getElementById('cancel'),stopped=false;
    manual.addEventListener('click',function(){stopped=true});
    var timer=setInterval(function(){
      if(stopped){clearInterval(timer);return}
      if(seconds>1){seconds--;cdText.textContent=seconds+'秒后自动跳转'}
      else{clearInterval(timer);window.location.href=targetUrl}
    },1000);
    cancel.addEventListener('click',function(){stopped=true;clearInterval(timer);cdText.textContent='已取消，请从上方选择或手动跳转';cancel.style.display='none'});

    /* --- 收藏弹窗 --- */
    var bookmarkBtn=document.getElementById('bookmarkBtn'),modal=document.getElementById('bookmarkModal'),closeBtn=document.getElementById('closeModalBtn');
    bookmarkBtn.addEventListener('click',function(){
      if(window.external && 'AddFavorite' in window.external) window.external.AddFavorite(location.href,document.title);
      else modal.classList.add('active');
    });
    closeBtn.addEventListener('click',function(){modal.classList.remove('active')});
    modal.addEventListener('click',function(e){if(e.target===modal)modal.classList.remove('active')});
  </script>
</body>
</html>
